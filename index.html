
<!-- CHAT INPUT -->

<div class="input-area">

    <input
        id="msg"
        type="text"
        placeholder="Ask J.A.R.V.I.S..."
        autocomplete="off"
    >

    <button id="send" type="button">SEND</button>

    <button id="mic-btn" type="button" aria-label="Start voice recognition">
        🎙️
    </button>

</div>

<!-- GEMINI API POPUP -->

<dialog id="apiDialog">

    <h2>J.A.R.V.I.S CONFIG</h2>

    <p>Enter your Google Gemini API Key.</p>

    <input
        type="password"
        id="geminiKey"
        placeholder="Paste Gemini API Key"
        autocomplete="off"
    >

    <button id="saveApiKey" type="button">
        ACTIVATE JARVIS
    </button>

    <button id="closeApiDialog" type="button">
        CANCEL
    </button>

    <p id="apiMessage"></p>

</dialog>
